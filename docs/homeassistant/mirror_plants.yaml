automation:
  # ---- Startup grace for the contract sensor (see sensor.mirror_plant_alerts above) ----
  - id: mirror_plants_startup_grace
    alias: Mirror plants - startup grace (hold alerts after HA start)
    description: >-
      Turns on input_boolean.mirror_plant_startup_grace at HA start and off again after the
      connection-lost raise delay plus 2 minutes, so ongoing alerts are not dropped from
      sensor.mirror_plant_alerts while the debounce timers restart.
    mode: restart
    triggers:
      - trigger: homeassistant
        event: start
    conditions: []
    actions:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.mirror_plant_startup_grace
      - delay:
          seconds: "{{ (((states('input_number.mirror_plant_raise_delay_min') | float(15)) + 2) * 60) | int }}"
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.mirror_plant_startup_grace

  # Safety net: the hold must never stick. If the grace flag has been on for 30 min, turn it off.
  - id: mirror_plants_startup_grace_watchdog
    alias: Mirror plants - startup grace watchdog
    description: Turns off a startup grace flag that has been on for more than 30 minutes.
    mode: single
    triggers:
      - trigger: time_pattern
        minutes: "/10"
    conditions:
      - condition: state
        entity_id: input_boolean.mirror_plant_startup_grace
        state: "on"
        for: "00:30:00"
    actions:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.mirror_plant_startup_grace


  # ---- iPhone push: on raise, at HA start, and every 6 h (clock-aligned) for each alert that is on ----
  # iOS cannot make a notification un-dismissable. This sends a time-sensitive push with a per-alert
  # tag (a re-send replaces the previous one). There is no wait loop, so restarts and automation
  # reloads cannot silently stop the re-sends; the next 6 h tick picks every active alert up again.
  - id: mirror_plants_phone_push
    alias: Mirror plants - iPhone time-sensitive push (raise, HA start, every 6 h)
    description: >-
      Pushes a time-sensitive notification for a plant alert when it turns on, and re-sends one
      for every active alert at HA start and at 00:00, 06:00, 12:00 and 18:00. Muted by
      input_boolean.mirror_plant_alerts_maintenance.
    mode: queued
    max: 12
    triggers:
      - trigger: state
        id: alert_on
        entity_id:
          - binary_sensor.family_room_soil_sensor_connection_lost
          - binary_sensor.family_room_waterer_connection_lost
          - binary_sensor.family_room_reservoir_empty_alert
          - binary_sensor.dining_room_soil_sensor_connection_lost
          - binary_sensor.dining_room_waterer_connection_lost
          - binary_sensor.dining_room_reservoir_empty_alert
          - binary_sensor.kitchen_soil_sensor_connection_lost
          - binary_sensor.kitchen_waterer_connection_lost
          - binary_sensor.kitchen_reservoir_empty_alert
        to: "on"
      - trigger: homeassistant
        id: resend
        event: start
      - trigger: time_pattern
        id: resend
        hours: "/6"
        minutes: 0
        seconds: 0
    conditions:
      - condition: not
        conditions:
          - condition: state
            entity_id: input_boolean.mirror_plant_alerts_maintenance
            state: "on"
    variables:
      notify_phone: notify.mobile_app_hea_iphone_14_pro_max
    actions:
      - variables:
          targets: >-
            {{ [trigger.entity_id] if trigger.id == 'alert_on'
               else expand(['binary_sensor.family_room_soil_sensor_connection_lost', 'binary_sensor.family_room_waterer_connection_lost', 'binary_sensor.family_room_reservoir_empty_alert', 'binary_sensor.dining_room_soil_sensor_connection_lost', 'binary_sensor.dining_room_waterer_connection_lost', 'binary_sensor.dining_room_reservoir_empty_alert', 'binary_sensor.kitchen_soil_sensor_connection_lost', 'binary_sensor.kitchen_waterer_connection_lost', 'binary_sensor.kitchen_reservoir_empty_alert']) | selectattr('state', 'eq', 'on') | map(attribute='entity_id') | list }}
      - repeat:
          for_each: "{{ targets }}"
          sequence:
            - action: "{{ notify_phone }}"
              data:
                title: "{{ 'Reservoir may be empty' if state_attr(repeat.item, 'kind') == 'reservoir_empty' else 'Connection lost' }}: {{ state_attr(repeat.item, 'label') }}"
                message: "{{ state_attr(repeat.item, 'detail') }} Re-sent every 6 hours until resolved."
                data:
                  tag: "{{ state_attr(repeat.item, 'tag') }}"
                  push:
                    interruption-level: time-sensitive

  # ---- iPhone: clear the tagged notification on recovery, then a normal push ----
  - id: mirror_plants_phone_clear
    alias: Mirror plants - iPhone clear on recovery
    description: >-
      When a plant alert turns off, remove its tagged notification with clear_notification
      and send a normal (non time-sensitive) recovery push.
    mode: parallel
    max: 12
    triggers:
      - trigger: state
        entity_id:
          - binary_sensor.family_room_soil_sensor_connection_lost
          - binary_sensor.family_room_waterer_connection_lost
          - binary_sensor.family_room_reservoir_empty_alert
          - binary_sensor.dining_room_soil_sensor_connection_lost
          - binary_sensor.dining_room_waterer_connection_lost
          - binary_sensor.dining_room_reservoir_empty_alert
          - binary_sensor.kitchen_soil_sensor_connection_lost
          - binary_sensor.kitchen_waterer_connection_lost
          - binary_sensor.kitchen_reservoir_empty_alert
        from: "on"
        to: "off"
    conditions: []
    variables:
      notify_phone: notify.mobile_app_hea_iphone_14_pro_max
    actions:
      - variables:
          alert_entity: "{{ trigger.entity_id }}"
          label: "{{ state_attr(alert_entity, 'label') }}"
          tag: "{{ state_attr(alert_entity, 'tag') }}"
      - action: "{{ notify_phone }}"
        data:
          message: clear_notification
          data:
            tag: "{{ tag }}"
      - action: "{{ notify_phone }}"
        data:
          title: "Plant alert cleared: {{ label }}"
          message: "{{ label }} is back to normal."

  # ---- Alert B email: once on raise, once on resolution ----
  - id: mirror_plants_reservoir_email
    alias: Mirror plants - reservoir empty email (once)
    description: >-
      Sends one email when a zone's reservoir flag turns on and one when it clears.
      (Connection-lost emails are handled by the alert: entities instead.)
    mode: queued
    max: 6
    triggers:
      - trigger: state
        id: raised
        entity_id:
          - binary_sensor.family_room_reservoir_empty_alert
          - binary_sensor.dining_room_reservoir_empty_alert
          - binary_sensor.kitchen_reservoir_empty_alert
        from: "off"
        to: "on"
      - trigger: state
        id: cleared
        entity_id:
          - binary_sensor.family_room_reservoir_empty_alert
          - binary_sensor.dining_room_reservoir_empty_alert
          - binary_sensor.kitchen_reservoir_empty_alert
        from: "on"
        to: "off"
    conditions:
      - condition: not
        conditions:
          - condition: state
            entity_id: input_boolean.mirror_plant_alerts_maintenance
            state: "on"
    variables:
      notify_email: notify.email   # PLACEHOLDER: OWNER MUST SET to the real email notify service
    actions:
      - variables:
          alert_entity: "{{ trigger.entity_id }}"
          label: "{{ state_attr(alert_entity, 'label') }}"
      - action: "{{ notify_email }}"
        data:
          title: "{{ 'Plant alert: ' ~ label ~ ' may be empty' if trigger.id == 'raised' else 'Plant alert resolved: ' ~ label }}"
          message: >-
            {{ state_attr(alert_entity, 'detail') if trigger.id == 'raised'
               else label ~ ' flag cleared (moisture rose or Refilled was pressed).' }}

  # ---- Alert B reset: moisture rise >= delta above the value at flag time, or Refilled button ----
  # The flag is SET by the paste-in snippet in plant-watering-stop-branch.md. It sets
  # <zone>_plant_reservoir_flag_moisture FIRST, then turns the flag on (order matters here).
  # Template triggers only fire on a false-to-true edge, so HA start and a /5 minute re-check
  # cover rises that happened while HA was down or an automation was reloading.
  - id: mirror_plants_reservoir_flag_clear
    alias: Mirror plants - clear reservoir flag (moisture rise or Refilled)
    description: >-
      Clears input_boolean.<zone>_plant_reservoir_empty when the zone's soil moisture is at
      least mirror_plant_reservoir_clear_delta points above the value stored when the flag was
      set, or when the zone's Refilled button is pressed. Re-checked at HA start and every 5 min.
    mode: queued
    max: 10
    triggers:
      - trigger: template
        id: rise_family_room
        value_template: >-
          {{ is_state('input_boolean.family_room_plant_reservoir_empty', 'on')
             and is_number(states('sensor.soil_moisture_sensor_1_family_room_soil_moisture'))
             and is_number(states('input_number.family_room_plant_reservoir_flag_moisture'))
             and (states('sensor.soil_moisture_sensor_1_family_room_soil_moisture') | float) - (states('input_number.family_room_plant_reservoir_flag_moisture') | float)
                 >= (states('input_number.mirror_plant_reservoir_clear_delta') | float(3)) }}
      - trigger: state
        id: btn_family_room
        entity_id: input_button.family_room_plant_reservoir_refilled
        not_from:
          - unavailable
          - unknown
      - trigger: template
        id: rise_dining_room
        value_template: >-
          {{ is_state('input_boolean.dining_room_plant_reservoir_empty', 'on')
             and is_number(states('sensor.soil_moisture_sensor_2_dining_room_soil_moisture'))
             and is_number(states('input_number.dining_room_plant_reservoir_flag_moisture'))
             and (states('sensor.soil_moisture_sensor_2_dining_room_soil_moisture') | float) - (states('input_number.dining_room_plant_reservoir_flag_moisture') | float)
                 >= (states('input_number.mirror_plant_reservoir_clear_delta') | float(3)) }}
      - trigger: state
        id: btn_dining_room
        entity_id: input_button.dining_room_plant_reservoir_refilled
        not_from:
          - unavailable
          - unknown
      - trigger: template
        id: rise_kitchen
        value_template: >-
          {{ is_state('input_boolean.kitchen_plant_reservoir_empty', 'on')
             and is_number(states('sensor.soil_moisture_sensor_3_kitchen_soil_moisture'))
             and is_number(states('input_number.kitchen_plant_reservoir_flag_moisture'))
             and (states('sensor.soil_moisture_sensor_3_kitchen_soil_moisture') | float) - (states('input_number.kitchen_plant_reservoir_flag_moisture') | float)
                 >= (states('input_number.mirror_plant_reservoir_clear_delta') | float(3)) }}
      - trigger: state
        id: btn_kitchen
        entity_id: input_button.kitchen_plant_reservoir_refilled
        not_from:
          - unavailable
          - unknown
      - trigger: homeassistant
        id: recheck
        event: start
      - trigger: time_pattern
        id: recheck
        minutes: "/5"
    conditions: []
    variables:
      soil_map:

        family_room: sensor.soil_moisture_sensor_1_family_room_soil_moisture
        dining_room: sensor.soil_moisture_sensor_2_dining_room_soil_moisture
        kitchen: sensor.soil_moisture_sensor_3_kitchen_soil_moisture
    actions:
      - variables:
          by_button: "{{ trigger.id.startswith('btn_') }}"
          zones: >-
            {{ ['family_room', 'dining_room', 'kitchen'] if trigger.id == 'recheck'
               else [trigger.id.split('_', 1)[1]] }}
      - repeat:
          for_each: "{{ zones }}"
          sequence:
            - if:
                - condition: template
                  value_template: >-
                    {% set z = repeat.item %}
                    {% set soil = states(soil_map[z]) %}
                    {% set base = states('input_number.' ~ z ~ '_plant_reservoir_flag_moisture') %}
                    {{ by_button
                       or (is_state('input_boolean.' ~ z ~ '_plant_reservoir_empty', 'on')
                           and is_number(soil) and is_number(base)
                           and (soil | float) - (base | float)
                               >= (states('input_number.mirror_plant_reservoir_clear_delta') | float(3))) }}
              then:
                - action: input_boolean.turn_off
                  target:
                    entity_id: "input_boolean.{{ repeat.item }}_plant_reservoir_empty"

# =============================================================================
# RECORDER / INFLUXDB note (attribute exclusion)
#
# The mirror reads the LIVE state over REST, so history is not needed for it to work.
#
# InfluxDB: ignore_attributes is a global list on the influxdb: integration, so add the two
# attribute names this package uses. Put it in your configuration.yaml influxdb: block
# (influxdb: cannot be safely merged from a package if you already define it):
#
#   influxdb:
#     ignore_attributes:
#       - alerts
#       - schema
#     include:
#       entities:
#         - sensor.mirror_plant_alerts
#         - input_boolean.family_room_plant_reservoir_empty
#         - input_boolean.dining_room_plant_reservoir_empty
#         - input_boolean.kitchen_plant_reservoir_empty
#         # ...plus your existing included entities
#
# Do NOT add the 9 helper binary_sensor.*_connection_lost / *_reservoir_empty_alert entities (or the
# 6 *_email_gate sensors) to the include list.
#
# Recorder: HA's recorder cannot drop a single attribute from a template entity via YAML.
# sensor.mirror_plant_alerts is rewritten whenever the attributes of an ACTIVE alert change, not
# only when one is raised or cleared: a stale-sensor detail text changes about hourly, and nothing
# changes for healthy devices. That is a handful of rows a day. If you still want it out of the
# database, exclude the whole entity
# (the mirror is unaffected):
#
#   recorder:
#     exclude:
#       entities:
#         - sensor.mirror_plant_alerts
# =============================================================================
